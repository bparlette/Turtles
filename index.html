<style>
@font-face{font-family:"PS2P";src:url(hub/PressStart2P.ttf) format("truetype");font-display:block}
:root{--y:#ffd23c;--g:#7fd85a}
html,body{margin:0;height:100%;background:#07070a;overflow:hidden}
body{color:#eee;font:16px/1.4 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
#hero{position:relative;width:100%;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a1030 0,#07070a 70%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cab{--S:1px;position:absolute;z-index:1;left:0;top:0;width:calc(704 * var(--S));height:calc(1520 * var(--S));background:url(shell-shock-live-home/cab/cabinet_special.png) 0 0/100% 100% no-repeat;touch-action:manipulation}
.x-stick{position:absolute;left:26.99%;top:57.50%;width:8.24%;height:5.39%;transform-origin:50% 95.1%;transition:transform 70ms ease-out;pointer-events:none;z-index:3}
.x-cap,.x-ring{position:absolute;pointer-events:none;border-radius:50%}
.x-cap{z-index:2;opacity:0;background:url(shell-shock-live-home/cab/cabinet_special.png) no-repeat;background-size:calc(704 * var(--S)) calc(1520 * var(--S));background-position:calc(var(--x) * -1 * var(--S)) calc(var(--y) * -1 * var(--S));transition:transform 50ms linear,filter 50ms linear}
.x-cap.on{opacity:1;transform:translateY(calc(3 * var(--S)));filter:brightness(.72);box-shadow:inset 0 calc(2 * var(--S)) calc(5 * var(--S)) rgba(0,0,0,.65)}
.x-ring{z-index:1;opacity:0;background:radial-gradient(circle,#0b0b0e 55%,#050507 72%,rgba(0,0,0,.6) 100%)}

.x-fx{position:absolute;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%;aspect-ratio:1;opacity:0;transition:opacity 60ms linear;width:9%}

/* the screen */
#screen{position:absolute;left:23.72%;top:34.41%;width:53.41%;height:17.83%;overflow:hidden;background:#000;--row:calc(1.2 * var(--S));z-index:4}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:6%/9%;
 background:radial-gradient(120% 90% at 30% 18%,rgba(255,255,255,.10),rgba(255,255,255,.03) 35%,transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%),repeating-linear-gradient(to bottom,transparent 0 var(--row),rgba(0,0,0,.18) var(--row) calc(var(--row) * 2));
 box-shadow:inset 0 0 calc(28 * var(--S)) calc(8 * var(--S)) rgba(0,0,0,.45),inset 0 0 4px 1px rgba(0,0,0,.7)}
#menu{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:calc(10 * var(--S)) calc(16 * var(--S));box-sizing:border-box;font-family:"PS2P",ui-monospace,monospace;-webkit-font-smoothing:none;font-smooth:never;text-transform:uppercase;background:radial-gradient(ellipse at 50% 0,#14203a 0,#05060c 75%)}
#menu .t{color:var(--y);font-size:calc(14 * var(--S));line-height:1;text-align:center;letter-spacing:calc(1 * var(--S));text-shadow:calc(2 * var(--S)) calc(2 * var(--S)) 0 #b02a10;margin:0 0 calc(14 * var(--S))}
#menu ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(7 * var(--S))}
#menu a{display:block;position:relative;color:#9aa4c8;text-decoration:none;padding:calc(5 * var(--S)) calc(6 * var(--S)) calc(5 * var(--S)) calc(26 * var(--S));border-radius:calc(3 * var(--S));touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline:none}
#menu a b{display:block;font-weight:400;font-size:calc(12 * var(--S));line-height:1.15;white-space:nowrap}
#menu a small{display:block;font-size:calc(8 * var(--S));line-height:1.3;margin-top:calc(4 * var(--S));color:#5d6790;white-space:nowrap}
#menu a::before{content:"";position:absolute;left:calc(8 * var(--S));top:calc(6 * var(--S));border-style:solid;border-width:calc(5 * var(--S)) 0 calc(5 * var(--S)) calc(9 * var(--S));border-color:transparent transparent transparent var(--y);opacity:0}
#menu a.sel{color:#fff;background:linear-gradient(90deg,rgba(255,210,60,.20),rgba(255,210,60,0))}
#menu a.sel b{color:#fff;text-shadow:0 0 calc(4 * var(--S)) rgba(255,210,60,.6)}
#menu a.sel small{color:var(--g)}
#menu a.sel::before{opacity:1;animation:cur .8s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
#menu a.go{animation:go .09s steps(1) infinite}
#menu a.go b,#menu a.go small{color:var(--y)}
@keyframes go{50%{visibility:hidden}}
#menu .h{margin-top:calc(12 * var(--S));text-align:center;font-size:calc(8 * var(--S));color:#6a7398;line-height:1.4}
#menu .h i{font-style:normal;color:var(--g)}
#menu .credit{animation:cur 1.2s steps(1) infinite}
#bar{position:absolute;z-index:6;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;pointer-events:none}
#bar a{pointer-events:auto;font:400 10px/1 "PS2P",ui-monospace,monospace;color:var(--y);text-decoration:none;background:rgba(10,8,14,.85);border:2px solid var(--y);border-radius:999px;padding:9px 14px;letter-spacing:1px}
#bar a:active{transform:translateY(2px)}
</style></head>
<body>
<div id="hero"><div id="cab">
  <div id="screen" role="navigation" aria-label="Select a game">
    <div id="menu">
      <p class="t">SELECT GAME</p>
      <ol id="opts">
        <li><a href="shell-shock-live/" class="sel"><b>PLAY SHELL SHOCK LIVE</b><small>THE ORIGINAL</small></a></li>
        <li><a href="shell-shock-16bit/"><b>PLAY SHELL SHOCK 16-BIT</b><small>GENESIS-STYLE PIXEL ART</small></a></li>

      </ol>
      <p class="h"><i>UP/DOWN</i> MOVE &nbsp; <i>A</i> SELECT<br><span class="credit">TAP A GAME TO START</span></p>
    </div>
  </div>
  <div class="x-fx" id="fx-a" style="left:59.2%;top:62.8%;--c:rgba(255,60,50,.48)"></div>
  <div class="x-fx" id="fx-b" style="left:70%;top:62.5%;--c:rgba(255,215,40,.48)"></div>
  <div class="x-fx" id="fx-p" style="left:81.1%;top:62.8%;--c:rgba(60,140,255,.48)"></div>
  <div class="x-ring" id="ring-a" style="left:55.966%;top:61.974%;width:6.676%;height:1.842%"></div>
  <div class="x-ring" id="ring-b" style="left:66.619%;top:61.579%;width:6.818%;height:1.842%"></div>
  <div class="x-ring" id="ring-p" style="left:77.841%;top:61.842%;width:6.676%;height:1.842%"></div>
  <div class="x-cap" id="cap-a" style="left:55.966%;top:61.974%;width:6.676%;height:1.842%;--x:394;--y:942"></div>
  <div class="x-cap" id="cap-b" style="left:66.619%;top:61.579%;width:6.818%;height:1.842%;--x:469;--y:936"></div>
  <div class="x-cap" id="cap-p" style="left:77.841%;top:61.842%;width:6.676%;height:1.842%;--x:548;--y:940"></div>
  <img class="x-stick" id="stick" src="shell-shock-live-home/cab/stick.png" alt="" draggable="false">
  <!-- cabinet controls: stick up/down halves + the three buttons (all select) -->
  <button class="hit" id="hit-up" type="button" aria-label="Joystick up" style="left:24.15%;top:56.6%;width:14.2%;height:5.0%"></button>
  <button class="hit" id="hit-dn" type="button" aria-label="Joystick down" style="left:24.15%;top:61.6%;width:14.2%;height:5.0%"></button>
  <button class="hit" id="hit-a" type="button" aria-label="Attack button: select" style="left:54.5%;top:60.6%;width:9.6%;height:4.6%"></button>
  <button class="hit" id="hit-b" type="button" aria-label="Jump button: select" style="left:65.2%;top:60.3%;width:9.6%;height:4.6%"></button>
  <button class="hit" id="hit-p" type="button" aria-label="Special button: select" style="left:76.4%;top:60.6%;width:9.6%;height:4.6%"></button>

</div>
<script>
(function(){
  var hero=document.getElementById("hero"), cab=document.getElementById("cab"), st=document.getElementById("stick");
  var opts=[].slice.call(document.querySelectorAll("#opts a")), cur=0, busy=false, lw=-1, lh=-1;
  function size(force){
    var vw=document.documentElement.clientWidth||innerWidth, vh=innerHeight;
    if(force!==true && vw===lw && Math.abs(vh-lh)<150) return;
    lw=vw; lh=vh; hero.style.height=vh+"px";
    var S=Math.min(vw/470,vh/900);
    cab.style.setProperty("--S",S+"px");
    cab.style.left=((vw-470*S)/2-150*S)+"px";
    cab.style.top=((vh-900*S)/2-140*S)+"px";
  }
  size(true); addEventListener("resize",size); addEventListener("orientationchange",function(){ setTimeout(function(){ size(true); },250); });

  var stT;
  function stick(dy){ clearTimeout(stT); st.style.transform="rotate(0deg) translateY("+(dy*2)+"%) scaleY("+(1-0.12*dy)+")";
    stT=setTimeout(function(){ st.style.transform=""; },160); }
  function press(k){ ["fx-","cap-","ring-"].forEach(function(p){ var e=document.getElementById(p+k); e.classList.add("on"); setTimeout(function(){ e.classList.remove("on"); },180); }); }
  function setSel(i){ cur=(i+opts.length)%opts.length; opts.forEach(function(a,j){ a.classList.toggle("sel",j===cur); a.setAttribute("aria-current",j===cur?"true":"false"); }); }
  function move(d){ if(busy) return; stick(d); setSel(cur+d); }
  function confirm(btn){ if(busy) return; busy=true; press(btn||"a"); var a=opts[cur]; a.classList.add("go");
    window.__hubGo=a.getAttribute("href");
    setTimeout(function(){ location.href=a.getAttribute("href"); },520); }
  window.__hub={move:move,confirm:confirm,get cur(){return cur;}};
  addEventListener("pageshow",function(){ busy=false; held=0; prev={}; opts.forEach(function(a){ a.classList.remove("go"); }); });

  /* keyboard */
  addEventListener("keydown",function(e){ var k=e.key;
    if(k==="ArrowUp"||k==="w"||k==="W"){ e.preventDefault(); move(-1); }
    else if(k==="ArrowDown"||k==="s"||k==="S"){ e.preventDefault(); move(1); }
    else if(k==="Enter"||k===" "||k==="Spacebar"){ e.preventDefault(); confirm("a"); } });
  /* tap / click an option directly; hover highlights on desktop */
  opts.forEach(function(a,i){
    a.addEventListener("click",function(e){ e.preventDefault(); if(busy) return; setSel(i); confirm("a"); });
    a.addEventListener("mouseenter",function(){ if(!busy && matchMedia("(hover:hover)").matches) setSel(i); });
  });
  /* cabinet stick + buttons */
  /* pointerdown (not click): iOS swallows rapid repeat clicks on the same spot as double-tap gestures */
  function bindHit(id,fn){ var el=document.getElementById(id), last=0;
    function go(e){ if(e.cancelable) e.preventDefault(); var n=Date.now(); if(n-last<60) return; last=n; fn(); }
    if(window.PointerEvent) el.addEventListener("pointerdown",go); else el.addEventListener("touchstart",go,{passive:false});
    el.addEventListener("click",function(e){ e.preventDefault(); if(Date.now()-last>400){ last=Date.now(); fn(); } }); }
  bindHit("hit-up",function(){ move(-1); });
  bindHit("hit-dn",function(){ move(1); });
  ["a","b","p"].forEach(function(k){ bindHit("hit-"+k,function(){ confirm(k); }); });
  document.addEventListener("dblclick",function(e){ e.preventDefault(); },{passive:false});
  /* gamepad: d-pad / left stick to move (with repeat), A or Start to select */
  var prev={}, held=0, next=0, raf=0;
  function poll(t){ raf=requestAnimationFrame(poll);
    var pads=navigator.getGamepads?navigator.getGamepads():[]; var up=false, dn=false, ok=false;
    for(var i=0;i<pads.length;i++){ var p=pads[i]; if(!p) continue; var b=p.buttons||[], ax=p.axes||[];
      var pr=function(n){ return !!(b[n]&&(b[n].pressed||b[n].value>0.5)); };
      var ay=p.mapping==="standard"?(ax[1]||0):0; /* non-standard pads: ignore drifting axes, use buttons */
      if(pr(12)||ay<-0.5) up=true; if(pr(13)||ay>0.5) dn=true; if(pr(0)||pr(9)) ok=true; }
    var dir=up?-1:dn?1:0;
    if(dir!==held){ held=dir; if(dir){ move(dir); next=t+380; } } else if(dir && t>=next){ move(dir); next=t+150; }
    if(ok && !prev.ok) confirm("a"); prev.ok=ok; }
  function startPad(){ if(!raf) raf=requestAnimationFrame(poll); }
  addEventListener("gamepadconnected",startPad);
  if(navigator.getGamepads){ var g=navigator.getGamepads(); for(var i=0;i<g.length;i++) if(g[i]) startPad(); }
})();
</script>
</body></html>
